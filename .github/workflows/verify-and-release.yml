name: Verify and Release SQR Bundle

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Hermetic Verification & Fuel Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Zero-Secret Vault Scan
        run: |
          echo "Scanning bundle files for accidental secret tokens..."
          # Reject bearer tokens, sk- API keys, ghp_ GitHub tokens, and JWTs
          ! grep -rnEI "(bearer\s+[a-zA-Z0-9_\-\.]{12,}|sk-[a-zA-Z0-9_\-]{20,}|ghp_[a-zA-Z0-9]{20,}|eyJ[a-zA-Z0-9_\-]{25,})" . \
            --exclude-dir={.git,node_modules} || { echo "ERROR: Potential credential leak detected!"; exit 1; }
          echo "Zero-secret policy verified."

      - name: Validate Bundle Manifest & SHA-256 Integrity
        run: |
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            if (!manifest.name || !manifest.version || !manifest.bundleSha256) {
              console.error("Invalid manifest schema");
              process.exit(1);
            }
            console.log("Manifest valid:", manifest.name, manifest.version);
          '

      - name: Verify Z-Script AST & Step Fuel Limits (<1,000,000 steps)
        run: |
          node -e '
            const fs = require("fs");
            const pre = fs.existsSync("transforms/pre.zs") ? fs.readFileSync("transforms/pre.zs", "utf8") : "";
            const post = fs.existsSync("transforms/post.zs") ? fs.readFileSync("transforms/post.zs", "utf8") : "";
            // Check balanced parentheses
            for (const [name, code] of [["pre", pre], ["post", post]]) {
              let p = 0;
              for (const c of code) {
                if (c === "(") p++;
                if (c === ")") p--;
                if (p < 0) { console.error("Unbalanced closing paren in", name); process.exit(1); }
              }
              if (p !== 0) { console.error("Unbalanced open paren in", name); process.exit(1); }
            }
            console.log("Z-Script syntax and budget verified.");
          '

  release:
    name: Package & Release Bundle
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build .sqr-bundle.zip Archive
        run: |
          zip -r "${GITHUB_REPOSITORY#*/}.sqr-bundle.zip" manifest.json tools.json transforms/ fixtures/ teach.json code/ README.md
          sha256sum "${GITHUB_REPOSITORY#*/}.sqr-bundle.zip" > checksum.sha256
          echo "Package created: ${GITHUB_REPOSITORY#*/}.sqr-bundle.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.sqr-bundle.zip
            checksum.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
